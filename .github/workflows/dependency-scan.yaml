name: Dependency scan

# pip-audit over requirements.txt, the pinned Python packages installed into
# the published container image.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  pip-audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # pip-audit lives in its own venv so its dependencies stay out of the
      # audited set. Pinned: a silent major bump would change what this gate
      # means.
      - name: Install pip-audit
        run: |
          python -m venv ./audit-venv
          ./audit-venv/bin/python -m pip install pip-audit==2.10.1

      # --strict fails on any package pip-audit cannot audit, so an unresolvable
      # dependency cannot pass as "no known vulnerabilities".
      - name: Run pip-audit
        run: ./audit-venv/bin/pip-audit --strict --desc --requirement requirements.txt
